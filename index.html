a Conceição (JMC), Presbyterian Theological Seminary.')}</li></ul><h3>${t('Projeto de pesquisa em desenvolvimento','Research project in progress')}</h3><p><em>${t('Da revelação ao sistema: lógica, conhecimento e unidade na filosofia cristã de Gordon Haddon Clark','From revelation to system: logic, knowledge and unity in Gordon Haddon Clark’s Christian philosophy')}</em></p><h3>${t('Áreas de interesse','Research interests')}</h3><p>${t('Filosofia cristã; epistemologia; lógica e linguagem; filosofia da religião; história da filosofia; escrituralismo; teologia bíblica e sistemática; tradição reformada.','Christian philosophy; epistemology; logic and language; philosophy of religion; history of philosophy; scripturalism; biblical and systematic theology; Reformed tradition.')}</p></article>`}

const entries=[["axioma", "Fundamento axiomático", "Axiomatic foundation", "O ponto de partida de um sistema não pode depender de uma demonstração interna sem circularidade. Clark propõe a revelação bíblica como fundamento, não como conclusão de uma epistemologia autônoma.", "A system cannot prove its own starting point internally without circularity. Clark proposes biblical revelation as its foundation rather than as a conclusion of autonomous epistemology.", "Como comparar axiomas rivais sem pressupor um critério independente?", "How can rival axioms be compared without assuming an independent criterion?", "An Introduction to Christian Philosophy, cap. III; p. 91 citada na resenha", "https://gordonhclark.com/wp-content/uploads/2014/04/GHC-Intro-Christian-Philosophy.pdf", "revelacao,logica"], ["revelacao", "Revelação proposicional", "Propositional revelation", "A comunicação divina possui conteúdo inteligível. A distinção entre reconhecer o sentido de uma afirmação e aceitá-la como verdadeira é decisiva para explicar a transmissão do conhecimento.", "Divine communication has intelligible content. Distinguishing understanding a statement from accepting it as true is crucial to explaining the transmission of knowledge.", "A comunicação proposicional esgota todas as dimensões da revelação?", "Does propositional communication exhaust every dimension of revelation?", "Knowledge (1960), verbete integral", "https://gordonhclark.com/knowledge-by-gordon-h-clark/", "axioma,verdade"], ["verdade", "Natureza da verdade", "Nature of truth", "A verdade não se identifica com a convicção subjetiva. Na exposição de Clark, proposições pertencem a uma totalidade inteligível, embora o indivíduo não conheça todas as suas relações.", "Truth is not identical with subjective conviction. On Clark’s account, propositions belong to an intelligible whole even when an individual does not know all their relations.", "A coerência estabelece a verdade ou apenas exclui certas formas de erro?", "Does coherence establish truth or merely exclude certain forms of error?", "The Nature of Truth, conclusão", "https://gordonhclark.com/the-nature-of-truth-by-gordon-h-clark/", "sistema,conhecimento"], ["conhecimento", "Conhecimento e opinião", "Knowledge and opinion", "A questão central não é simplesmente possuir uma crença, mas determinar sua condição epistêmica. Uma crença pode ser verdadeira sem que sua justificação esteja demonstrada.", "The central issue is not merely holding a belief but determining its epistemic status. A belief may be true without its justification being demonstrated.", "Qual é o estatuto das crenças ordinárias sobre acontecimentos particulares?", "What is the status of ordinary beliefs about particular events?", "Know, Knowledge (1975), §3", "https://gordonhclark.com/know-knowledge-by-gordon-h-clark/", "empirismo,fe"], ["empirismo", "Crítica do empirismo", "Critique of empiricism", "A história da epistemologia apresentada por Clark contrasta tentativas de derivar conceitos da sensação com abordagens racionalistas. O problema é explicar como dados particulares sustentariam conclusões necessárias.", "Clark’s history of epistemology contrasts attempts to derive concepts from sensation with rationalist approaches. The problem is how particular data could support necessary conclusions.", "Uma epistemologia falibilista responde a essa crítica sem reivindicar certeza?", "Can a fallibilist epistemology answer this critique without claiming certainty?", "Epistemology (1968), verbete integral", "https://gordonhclark.com/epistemology-by-gordon-h-clark/", "ceticismo,conhecimento"], ["ceticismo", "Ceticismo filosófico e moral", "Philosophical and moral skepticism", "Negar a possibilidade do conhecimento é diferente de questionar uma afirmação específica. Clark relaciona ainda o problema da objetividade moral à fundamentação das normas.", "Denying the possibility of knowledge differs from questioning a particular claim. Clark also connects moral objectivity with the grounds of norms.", "A crítica ao ceticismo global também refuta formas locais de dúvida?", "Does criticism of global skepticism also refute local forms of doubt?", "Skepticism (1973), verbete integral", "https://gordonhclark.com/skepticism-by-gordon-h-clark/", "empirismo,etica"], ["logica", "Lógica e inferência", "Logic and inference", "Um argumento válido preserva a verdade de suas premissas. Na filosofia cristã de Clark, a racionalidade não constitui uma autoridade concorrente da revelação. É necessário distinguir validade formal e verdade das premissas.", "A valid argument preserves the truth of its premises. In Clark’s Christian philosophy rationality is not a competing authority to revelation. Formal validity must be distinguished from the truth of premises.", "Qual é a relação entre as leis lógicas e a natureza divina?", "What is the relation between logical laws and the divine nature?", "An Introduction to Christian Philosophy, resenha introdutória, p. 3", "https://gordonhclark.com/wp-content/uploads/2014/04/GHC-Intro-Christian-Philosophy.pdf", "axioma,sistema"], ["sistema", "Unidade sistemática", "Systematic unity", "O sistema é mais que uma coleção de afirmações: exige relações inteligíveis entre suas partes. A incompletude do conhecimento humano não implica que a realidade seja contraditória.", "A system is more than a collection of statements: it requires intelligible relations among its parts. The incompleteness of human knowledge does not imply a contradictory reality.", "Como distinguir consequências necessárias de hipóteses interpretativas?", "How can necessary consequences be distinguished from interpretive hypotheses?", "The Nature of Truth, discussão final", "https://gordonhclark.com/the-nature-of-truth-by-gordon-h-clark/", "verdade,logica"], ["fe", "Fé e assentimento", "Faith and assent", "Clark examina a análise protestante tradicional da fé: conhecimento, assentimento e confiança. A questão é se confiança designa um ato mental distinto ou uma forma de crença cujo conteúdo precisa ser especificado.", "Clark examines the traditional Protestant analysis of faith: knowledge, assent and trust. The question is whether trust denotes a distinct mental act or a form of belief whose content needs specification.", "Como a análise se relaciona com a Confissão de Westminster, capítulo XIV?", "How does this analysis relate to Westminster Confession, chapter XIV?", "Know, Knowledge (1975), §2", "https://gordonhclark.com/know-knowledge-by-gordon-h-clark/", "conhecimento,revelacao"], ["deus", "Conhecimento divino e humano", "Divine and human knowledge", "A controvérsia de 1944 envolve o alcance e o caráter do conhecimento humano de Deus. Clark distingue finitude do sujeito e inteligibilidade do conteúdo conhecido. Seus críticos questionaram as implicações dessa posição para a incompreensibilidade divina.", "The 1944 controversy concerns the scope and character of human knowledge of God. Clark distinguishes the finitude of the subject from the intelligibility of known content. Critics questioned its implications for divine incomprehensibility.", "Compartilhar conteúdo verdadeiro implica identidade no modo de conhecer?", "Does sharing true content imply identity in the mode of knowing?", "On the Minority Report (1946), resposta de Clark; The Complaint, contraponto", "https://gordonhclark.com/wp-content/uploads/2015/06/Unpublished-143.-On-The-Minority-Report-typed.pdf", "revelacao,conhecimento"], ["etica", "Fundamentação da ética", "Grounds of ethics", "Uma descrição de costumes não estabelece por si uma obrigação universal. O problema de pesquisa é distinguir a origem social de uma crença moral da autoridade normativa de um mandamento.", "A description of customs does not by itself establish universal obligation. The research problem is to distinguish the social origin of a moral belief from the normative authority of a command.", "Qual é a relação entre vontade divina, bondade e obrigação?", "What is the relation function catalogKey(v){let k=norm(v).replace(/['’]/g,'').replace(/&/g,' and ').replace(/\s*\((?:works, vol\.[^)]*|2nd ed\.|coeditor|editor)\)/g,'').replace(/[^a-z0-9]+/g,' ').trim();const aliases=[[/^what (do )?presbyterians believe.*/,'what do presbyterians believe'],[/^thales to dewey.*/,'thales to dewey'],[/^ancient philosophy.*/,'ancient philosophy'],[/^a history of philosophy part one ancient philosophy/,'ancient philosophy'],[/^first corinthians.*/,'first corinthians'],[/^1 corinthians 11 1 16$/,'first corinthians'],[/^westminster confession chapter i commentary$/,'what do presbyterians believe'],[/^first john.*/,'first john'],[/^colossians.*/,'colossians'],[/^gods hammer.*/,'gods hammer'],[/^today s evangelism.*/,'todays evangelism counterfeit or genuine'],[/^the philosophy of gordon h clark.*/,'the philosophy of gordon h clark'],[/^the logos 1984 lecture$/,'the logos'],[/^1 and 2 peter$/,'new heavens new earth']];for(const [re,v] of aliases)if(re.test(k))return v;return k}
function catalog(){const m=new Map();function add(x){const k=catalogKey(x.en);let v=m.get(k);if(!v){v={...x,key:k,years:[],editions:[],links:[],notes:[]};m.set(k,v)}if(x.year&&!v.years.includes(x.year))v.years.push(x.year);if(x.edition&&!['1 corinthians 11 1 16','westminster confession chapter i commentary'].includes(norm(x.en).replace(/[^a-z0-9]+/g,' ').trim())&&!v.editions.includes(x.edition))v.editions.push(x.edition);if(x.pt&&(!v.pt||v.pt===v.en))v.pt=x.pt;if(x.kind==='secondary')v.kind='secondary';if(x.author&&x.author!=='Gordon H. Clark')v.author=x.author;if(x.links)for(const y of x.links)if(!v.links.some(z=>z[1]===y[1]))v.links.push(y);if(x.note)v.notes.push(x.note);return v}

function localCorpusPanel(p){if(p!=='archive')return '';return '<section class="inventory-panel"><h2>'+t('Documentos históricos','Historical documents')+'</h2>'+GHC_LOCAL_CORPUS.rows.filter(x=>x.kind==='archive').map(x=>'<article class="tile"><h3>'+esc(t(x.pt,x.en))+'</h3><p>'+esc(x.author)+' · '+esc(x.edition)+'</p></article>').join('')+'</section>'}
function inventoryPanel(){const d=GHC_RESEARCH.data,records=catalog(),primary=records.filter(v=>catalogGroup(v)==='primary').length;return '<section class="inventory-panel"><h2>'+t('Panorama documental','Documentary overview')+'</h2><article class="tile"><h3>'+t('Catálogo do Instituto','Institute catalogue')+'</h3><p><strong>'+records.length+'</strong> '+t('registros bibliográficos','bibliographic records')+' · '+primary+' '+t('fontes primárias','primary sources')+' · '+(records.length-primary)+' '+t('referências secundárias','secondary references')+'</p><p>'+t('Contagem dinâmica de registros únicos do catálogo, não de arquivos integrais.','Live count of unique catalogue records, not full-text files')+'</p><a href="#library">'+t('Consultar biblioteca','Browse library')+'</a></article><h3>'+t('Inventários históricos de referência','Historical reference inventories')+'</h3><div class="inventory-grid">'+d.series.map(g=>'<article class="inventory-chart"><h3>'+t(g.pt,g.en)+'</h3>'+g.rows.map(x=>'<div class="inventory-row"><div class="inventory-label"><span>'+esc(t(x[0],x[1]))+'</span><strong>'+x[2]+'</strong></div><div class="inventory-track"><div class="inventory-bar" style="width:'+100*x[2]/Math.max(...g.rows.map(y=>y[2]))+'%"></div></div></div>').join('')+'<p class="inventory-note">'+esc(t(g.note,g.noteEN))+' <a href="'+g.source+'">'+t('Fonte','Source')+'</a></p></article>').join('')+'</div></section>'}
function archivalPage(){return title('Arquivo histórico e documental','Historical and documentary archive')+`<p>${t('Catálogo seletivo de fontes primárias e secundárias. Os identificadores de cartas seguem o índice da Gordon H. Clark Foundation.','Selective catalogue of primary and secondary sources. Letter IDs follow the Gordon H. Clark Foundation index.')}</p><article class="tile" id="correspondencias"><h2>${t('Correspondências e interlocuções','Correspondence and exchanges')}</h2><p>${t('Arquivo Clark–Van Til: 24 registros, cartas diretas e indiretas, documentos eclesiásticos, cotas e fontes institucionais.','Clark–Van Til archive: 24 records, direct and indirect letters, ecclesiastical documents, archival references and institutional sources.')}</p><a class="button" href="correspondencia-clark-vantil.html">${t('Consultar correspondências','Browse correspondence')}</a> · <a href="clark-vantil.csv">${t('Catálogo CSV','CSV catalogue')}</a></article><h2>${t('Catálogo geral do arquivo','General archive catalogue')}</h2><div class="filters"><input id="archiveq" value="${esc(archiveQuery)}" placeholder="${t('Nome, título ou data','Name, title or date')}" oninput="archiveQuery=this.value;archiveResults()"><select onchange="archiveKind=this.value;archiveResults()"><option value="">${t('Todos os tipos','All types')}</option>${[...new Map(archival.map(x=>[x[2],x[3]])).entries()].map(x=>`<option value="${x[0]}" ${archiveKind===x[0]?'selected':''}>${t(...x)}</option>`).join('')}</select></div><div id="archiveResults"></div><div id="archiveReader"></div><h2>${t('Acervos externos','External collections')}</h2><div class="grid">${docs.map((x,i)=>doc(i)).join('')}<article class="tile"><h3>${t('Fotografias e áudio','Photographs and audio')}</h3><p>${t('Consulte as coleções originais; imagens não reproduzidas sem verificação de direitos.','Consult original collections; images not reproduced without rights verification.')}</p><a href="https://gordonhclark.com/">Gordon H. Clark Foundation ↗</a><p><a href="https://www.douglasdouma.com/">Douglas Douma ↗</a></p></article></div><div id="reader"></div>`}
function updateNavArrows(){const n=$('nav');$('navprev').disabled=n.scrollLeft<=1;$('navnext').disabled=n.scrollLeft+n.clientWidth>=n.scrollWidth-2;}$('navprev').onclick=()=>$('nav').scrollBy({left:-Math.max(160,$('nav').clientWidth*.65),behavior:'smooth'});$('navnext').onclick=()=>$('nav').scrollBy({left:Math.max(160,$('nav').clientWidth*.65),behavior:'smooth'});$('nav').addEventListener('scroll',updateNavArrows,{passive:true});window.addEventListener('resize',updateNavArrows);$('global').oninput=e=>{query=e.target.value.trim();render()};$('menu').onclick=()=>{$('nav').classList.toggle('open');$('menu').setAttribute('aria-expanded',$('nav').classList.contains('open'))};$('lang').onclick=()=>{lang=t('en','pt');localStorage.setItem('lang',lang);render()};$('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('dark',document.body.classList.contains('dark')?'1':'0')};if(localStorage.getItem('dark')==='1')document.body.classList.add('dark');let promptEvent;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e});$('install').onclick=async()=>{if(promptEvent){await promptEvent.prompt();promptEvent=null}else alert(t('Após publicar via HTTPS, abra o menu do Chrome e escolha Instalar aplicativo ou Adicionar à tela inicial.','After HTTPS deployment, use Chrome’s Install app or Add to Home screen option.'))};window.addEventListener('hashchange',()=>{let p=location.hash.slice(1);if(p==='letters')p='archive';if(sections.some(x=>x[0]===p)){page=p;query='';render()}});if(location.hash==='#letters')page='archive';else if(sections.some(x=>x[0]===location.hash.slice(1)))page=location.hash.slice(1);render();if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(console.warn);
</script></body></html>
