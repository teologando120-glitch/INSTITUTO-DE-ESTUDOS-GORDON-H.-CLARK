const entries=[["axioma", "Fundamento axiomático", "Axiomatic foundation", "O ponto de partida de um sistema não pode depender de uma demonstração interna sem circularidade. Clark propõe a revelação bíblica como fundamento, não como conclusão de uma epistemologia autônoma.", "A system cannot prove its own starting point internally without circularity. Clark proposes biblical revelation as its foundation rather than as a conclusion of autonomous epistemology.", "Como comparar axiomas rivais sem pressupor um critério independente?", "How can rival axioms be compared without assuming an independent criterion?", "An Introduction to Christian Philosophy, cap. III; p. 91 citada na resenha", "https://gordonhclark.com/wp-content/uploads/2014/04/GHC-Intro-Christian-Philosophy.pdf", "revelacao,logica"], ["revelacao", "Revelação proposicional", "Propositional revelation", "A comunicação divina possui conteúdo inteligível. A distinção entre reconhecer o sentido de uma afirmação e aceitá-la como verdadeira é decisiva para explicar a transmissão do conhecimento.", "Divine communication has intelligible content. Distinguishing understanding a statement from accepting it as true is crucial to explaining the transmission of knowledge.", "A comunicação proposicional esgota todas as dimensões da revelação?", "Does propositional communication exhaust every dimension of revelation?", "Knowledge (1960), verbete integral", "https://gordonhclark.com/knowledge-by-gordon-h-clark/", "axioma,verdade"], ["verdade", "Natureza da verdade", "Nature of truth", "A verdade não se identifica com a convicção subjetiva. Na exposição de Clark, proposições pertencem a uma totalidade inteligível, embora o indivíduo não conheça todas as suas relações.", "Truth is not identical with subjective conviction. On Clark’s account, propositions belong to an intelligible whole even when an individual does not know all their relations.", "A coerência estabelece a verdade ou apenas exclui certas formas de erro?", "Does coherence establish truth or merely exclude certain forms of error?", "The Nature of Truth, conclusão", "https://gordonhclark.com/the-nature-of-truth-by-gordon-h-clark/", "sistema,conhecimento"], ["conhecimento", "Conhecimento e opinião", "Knowledge and opinion", "A questão central não é simplesmente possuir uma crença, mas determinar sua condição epistêmica. Uma crença pode ser verdadeira sem que sua justificação esteja demonstrada.", "The central issue is not merely holding a belief but determining its epistemic status. A belief may be true without its justification being demonstrated.", "Qual é o estatuto das crenças ordinárias sobre acontecimentos particulares?", "What is the status of ordinary beliefs about particular events?", "Know, Knowledge (1975), §3", "https://gordonhclark.com/know-knowledge-by-gordon-h-clark/", "empirismo,fe"], ["empirismo", "Crítica do empirismo", "Critique of empiricism", "A história da epistemologia apresentada por Clark contrasta tentativas de derivar conceitos da sensação com abordagens racionalistas. O problema é explicar como dados particulares sustentariam conclusões necessárias.", "Clark’s history of epistemology contrasts attempts to derive concepts from sensation with rationalist approaches. The problem is how particular data could support necessary conclusions.", "Uma epistemologia falibilista responde a essa crítica sem reivindicar certeza?", "Can a fallibilist epistemology answer this critique without claiming certainty?", "Epistemology (1968), verbete integral", "https://gordonhclark.com/epistemology-by-gordon-h-clark/", "ceticismo,conhecimento"], ["ceticismo", "Ceticismo filosófico e moral", "Philosophical and moral skepticism", "Negar a possibilidade do conhecimento é diferente de questionar uma afirmação específica. Clark relaciona ainda o problema da objetividade moral à fundamentação das normas.", "Denying the possibility of knowledge differs from questioning a particular claim. Clark also connects moral objectivity with the grounds of norms.", "A crítica ao ceticismo global também refuta formas locais de dúvida?", "Does criticism of global skepticism also refute local forms of doubt?", "Skepticism (1973), verbete integral", "https://gordonhclark.com/skepticism-by-gordon-h-clark/", "empirismo,etica"], ["logica", "Lógica e inferência", "Logic and inference", "Um argumento válido preserva a verdade de suas premissas. Na filosofia cristã de Clark, a racionalidade não constitui uma autoridade concorrente da revelação. É necessário distinguir validade formal e verdade das premissas.", "A valid argument preserves the truth of its premises. In Clark’s Christian philosophy rationality is not a competing authority to revelation. Formal validity must be distinguished from the truth of premises.", "Qual é a relação entre as leis lógicas e a natureza divina?", "What is the relation between logical laws and the divine nature?", "An Introduction to Christian Philosophy, resenha introdutória, p. 3", "https://gordonhclark.com/wp-content/uploads/2014/04/GHC-Intro-Christian-Philosophy.pdf", "axioma,sistema"], ["sistema", "Unidade sistemática", "Systematic unity", "O sistema é mais que uma coleção de afirmações: exige relações inteligíveis entre suas partes. A incompletude do conhecimento humano não implica que a realidade seja contraditória.", "A system is more than a collection of statements: it requires intelligible relations among its parts. The incompleteness of human knowledge does not imply a contradictory reality.", "Como distinguir consequências necessárias de hipóteses interpretativas?", "How can necessary consequences be distinguished from interpretive hypotheses?", "The Nature of Truth, discussão final", "https://gordonhclark.com/the-nature-of-truth-by-gordon-h-clark/", "verdade,logica"], ["fe", "Fé e assentimento", "Faith and assent", "Clark examina a análise protestante tradicional da fé: conhecimento, assentimento e confiança. A questão é se confiança designa um ato mental distinto ou uma forma de crença cujo conteúdo precisa ser especificado.", "Clark examines the traditional Protestant analysis of faith: knowledge, assent and trust. The question is whether trust denotes a distinct mental act or a form of belief whose content needs specification.", "Como a análise se relaciona com a Confissão de Westminster, capítulo XIV?", "How does this analysis relate to Westminster Confession, chapter XIV?", "Know, Knowledge (1975), §2", "https://gordonhclark.com/know-knowledge-by-gordon-h-clark/", "conhecimento,revelacao"], ["deus", "Conhecimento divino e humano", "Divine and human knowledge", "A controvérsia de 1944 envolve o alcance e o caráter do conhecimento humano de Deus. Clark distingue finitude do sujeito e inteligibilidade do conteúdo conhecido. Seus críticos questionaram as implicações dessa posição para a incompreensibilidade divina.", "The 1944 controversy concerns the scope and character of human knowledge of God. Clark distinguishes the finitude of the subject from the intelligibility of known content. Critics questioned its implications for divine incomprehensibility.", "Compartilhar conteúdo verdadeiro implica identidade no modo de conhecer?", "Does sharing true content imply identity in the mode of knowing?", "On the Minority Report (1946), resposta de Clark; The Complaint, contraponto", "https://gordonhclark.com/wp-content/uploads/2015/06/Unpublished-143.-On-The-Minority-Report-typed.pdf", "revelacao,conhecimento"], ["etica", "Fundamentação da ética", "Grounds of ethics", "Uma descrição de costumes não estabelece por si uma obrigação universal. O problema de pesquisa é distinguir a origem social de uma crença moral da autoridade normativa de um mandamento.", "A description of customs does not by itself establish universal obligation. The research problem is to distinguish the social origin of a moral belief from the normative authority of a command.", "Qual é a relação entre vontade divina, bondade e obrigação?", "What is the relation between divine will, goodness and obligation?", "Skepticism (1973), parágrafo inicial; leitura complementar: A Christian View of Men and Things", "https://gordonhclark.com/skepticism-by-gordon-h-clark/", "ceticismo,axioma"]];

function encyclopedia(){let x=entries.find(a=>a[0]===selectedEntry);return title('Enciclopédia Clarkiana','Clarkian Encyclopedia')+`<p>${t('Estudos autorais introdutórios apoiados em fontes documentais. As questões críticas são propostas editoriais, não afirmações de Clark.','Original introductory studies grounded in documentary sources. Critical questions are editorial proposals, not claims by Clark.')}</p>`+(x?`<article class="tile"><button onclick="selectedEntry='';render()">← ${t('Todos os estudos','All studies')}</button><h2>${t(x[1],x[2])}</h2><h3>${t('Exposição','Exposition')}</h3><p>${t(x[3],x[4])}</p><h3>${t('Problema e objeção possível','Problem and possible objection')}</h3><p>${t(x[5],x[6])}</p><h3>${t('Referência documental','Documentary reference')}</h3><p>${x[7]}</p><a class="button" href="${x[8]}" target="_blank" rel="noopener">${t('Consultar fonte','Consult source')} ↗</a><h3 style="margin-top:24px">${t('Conceitos relacionados','Related concepts')}</h3><div class="filters">${x[9].split(',').map(id=>{let a=entries.find(e=>e[0]===id);return `<button onclick="openEntry('${id}')">${t(a[1],a[2])}</button>`}).join('')}</div></article>`:`<div class="grid">${entries.map(entryCard).join('')}</div>`)}

 "Carta", "Letter", "From John Robbins", "https://gordonhclark.com/list-of-extant-correspondence-of-gordon-h-clark/", "index"], ["707", "1974-10-24", "Carta", "Letter", "To Robert Reymond", "https://gordonhclark.com/list-of-extant-correspondence-of-gordon-h-clark/", "index"], ["789", "1980-08-25", "Carta", "Letter", "From George Marsden", "https://gordonhclark.com/list-of-extant-correspondence-of-gordon-h-clark/", "index"], ["", "1959", "Artigo", "Article", "Moses and the Ecumenical Movement", "https://gordonhclark.com/writings-of-gordon-clark/", "index"], ["", "1959", "Artigo", "Article", "The Resurrection", "https://gordonhclark.com/writings-of-gordon-clark/", "index"], ["", "1959", "Artigo", "Article", "Logical Positivism and Neo-Orthodoxy", "https://gordonhclark.com/writings-of-gordon-clark/", "index"], ["", "1953", "Artigo", "Article", "Review of Greeks and the Irrational", "https://gordonhclark.com/category/writings/", "index"], ["", "1980", "Artigo", "Article", "Faith and Presumption in Prayer", "https://gordonhclark.com/category/writings/", "index"], ["", "1946", "Manuscrito", "Manuscript", "On the Minority Report", "https://gordonhclark.com/wp-content/uploads/2015/06/Unpublished-143.-On-The-Minority-Report-typed.pdf", "direct"], ["", "2013", "Tradução", "Translation", "Uma Introdução à Filosofia Cristã — Marcos Vasconcelos; Brasília: Monergismo", "https://www.editoramonergismo.com.br/", "index"], ["", "2017", "Estudo secundário", "Secondary study", "Douglas J. Douma — The Presbyterian Philosopher", "https://www.douglasdouma.com/2017/01/23/now-available-the-presbyterian-philosopher-the-authorized-biography-of-gordon-h-clark/", "direct"]];
let archiveKind='', archiveQuery='';
function archiveCard(x,i){return `<article class="record"><small>${esc(x[1])}</small><div><div class="eyebrow">${t(x[2],x[3])} ${x[0]?' · ID '+x[0]:''}</div><h3>${esc(x[4])}</h3><p>${x[5].includes('correspondence')?t('Registro de correspondência: a direção é relativa a Clark.','Correspondence record: direction is relative to Clark.'):''} ${x[6]==='index'?t('Registro identificado; texto integral não incorporado.','Identified record; full text not embedded.'):t('Fonte documental externa.','External documentary source.')}</p><a class="button" href="${x[5]}" target="_blank" rel="noopener">${t('Consultar fonte','Consult source')} ↗</a> ${x[6]==='direct'?`<button onclick="archiveRead(${i})">${t('Ler no portal','Read in portal')}</button>`:''}</div></article>`}
function archiveRead(i){let x=archival[i];$('archiveReader').innerHTML=`<h3>${esc(x[4])}</h3><iframe title="${esc(x[4])}" src="${x[5]}" loading="lazy"></iframe><p><a href="${x[5]}" target="_blank" rel="noopener">${t('Abrir fonte original','Open original source')}</a></p>`;$('archiveReader').scrollIntoView({behavior:'smooth'})}
function archiveResults(){let a=archival.map((x,i)=>[x,i]).filter(([x])=>(!archiveKind||x[2]===archiveKind)&&norm(x.join(' ')).includes(norm(archiveQuery)) );$('archiveResults').innerHTML=`<p>${a.length} ${t('registros','records')}</p>`+a.map(([x,i])=>archiveCard(x,i)).join('')}
function analyticalPanel(){if(typeof GHC_ANALYTICAL==='undefined')return '';return '<section class="inventory-panel" id="analytical-index"><h2>'+t('Concordância filosófica · primeira série','Philosophical concordance · first series')+'</h2><p>'+t('Localizadores conferidos nos exemplares de pesquisa. PDF indica a página física do arquivo, não a paginação impressa. Indexação parcial.','Locators checked against research copies. PDF denotes the physical file page, not printed pagination. Partial indexing.')+'</p><input type="search" aria-label="'+t('Pesquisar conceitos','Search concepts')+'" placeholder="'+t('Conceito, autor, obra ou passagem bíblica','Concept, author, work or Bible passage')+'" oninput="filterAnalytical(this.value)"><div>'+GHC_ANALYTICAL.rows.map(x=>'<article class="tile analytical-record" data-search="'+esc(x.join(' '))+'"><h3>'+esc(t(x[1],x[0]))+'</h3><p>'+esc(x[2])+' · '+esc(x[3])+'</p><p>'+esc(t(x[4],x[5]))+'</p></article>').join('')+'</div><details><summary>Language and Theology · '+t('Sumário conferido','Verified contents')+'</summary><ol>'+GHC_ANALYTICAL.chapters.map(x=>'<li>'+esc(t(x[1],x[0]))+'</li>').join('')+'</ol><p>'+t('Edição 2012, Trinity Foundation; sumário PDF 3. Primeira edição 1980, segunda 1993, coletânea Modern Philosophy 2008 (PDF 2).','2012 edition, Trinity Foundation; contents PDF 3. First edition 1980, second 1993, Modern Philosophy collection 2008 (PDF 2).')+'</p></details></section>'}function filterAnalytical(q){document.querySelectorAll('.analytical-record').forEach(el=>{el.hidden=!norm(el.dataset.search).includes(norm(q));el.style.display=el.hidden?'none':''})}
function localCorpusPanel(p){if(typeof GHC_LOCAL_CORPUS==='undefined')return '';const d=GHC_LOCAL_CORPUS;const labels={book:['Livros','Books'],article:['Artigos e excertos','Articles and excerpts'],secondary:['Bibliografia secundária e obras coletivas','Secondary and collected works'],archive:['Documentos históricos','Historical documents'],tool:['Instrumentos de pesquisa','Research tools']};const kinds=p==='archive'?['archive','tool']:['book','article','secondary'];return '<section class="inventory-panel" id="local-corpus"><h2>'+t('Acervo de investigação: exemplares recebidos','Research collection: received copies')+'</h2><p>'+t('Inventário preliminar de exemplares privados. Títulos traduzidos podem ser descritivos; datas indicam edições ou republicações, não necessariamente a primeira publicação. Não constitui acesso ao texto integral.','Preliminary inventory of private copies. Translated titles may be descriptive; dates refer to editions or reprints, not necessarily first publication. Full texts are not provided.')+'</p><input type="search" aria-label="'+t('Pesquisar acervo','Search collection')+'" placeholder="'+t('Título, autor, edição','Title, author, edition')+'" oninput="filterLocalCorpus(this.value)">'+kinds.map(k=>'<details open><summary>'+t(...labels[k])+' · '+d.rows.filter(x=>x.kind===k).length+'</summary>'+d.rows.filter(x=>x.kind===k).map(x=>'<article class="tile corpus-record"><h3>'+esc(t(x.pt,x.en))+'</h3><small>'+esc(t(x.en,x.pt))+'</small><p>'+esc(x.author)+' · '+esc(x.edition)+'</p><small>'+t('Recebido · revisão bibliográfica pendente','Received · bibliographic review pending')+'</small></article>').join('')+'</details>').join('')+'<p><a href="https://www.trinityfoundation.org/archive.php?s=1">The Trinity Review</a> · <a href="https://gordonhclark.com/">Gordon H. Clark Foundation</a></p></section>'}
function filterLocalCorpus(q){document.querySelectorAll('.corpus-record').forEach(el=>{el.style.display=norm(el.textContent).includes(norm(q))?'':'none'})}
function inventoryPanel(){if(typeof GHC_RESEARCH==='undefined')return '';const d=GHC_RESEARCH.data;return `<section class="inventory-panel"><div class="eyebrow">GHC · ${t('Manuscritologia','Manuscript studies')}</div><h2>${t('Observatório do acervo documental','Documentary inventory observatory')}</h2><p class="inventory-note">${t('Linha de base histórica, não total de documentos digitalizados. Dados do dossiê registrados em','Historical baseline, not total digitized documents. Dossier data recorded on')} ${d.date}.</p><div class="inventory-chart"><h3>${t("Recebimento do acervo privado","Private collection intake")}</h3>${[18,13,20].map((n,i)=>`<div class="inventory-row"><div class="inventory-label"><span>${t("Lote","Batch")} ${i+1}</span><strong>${n}</strong></div><div class="inventory-track"><div class="inventory-bar" style="width:${n/20*100}%"></div></div></div>`).join("")}<p>${t("51 arquivos recebidos; 45 registros preliminares agrupados, não títulos inéditos nem documentos integralmente verificados.","51 files received; 45 preliminary grouped records, not new titles or fully verified documents.")}</p></div><div class="inventory-grid">${d.series.map(g=>{const max=Math.max(1,...g.rows.map(x=>x[2]));return `<article class="inventory-chart"><h3>${t(g.pt,g.en)}</h3>${g.rows.map(x=>`<div class="inventory-row"><div class="inventory-label"><span>${esc(t(x[0],x[1]))}</span><strong>${x[2]}</strong></div><div class="inventory-track" aria-hidden="true"><div class="inventory-bar" style="width:${100*x[2]/max}%"></div></div></div>`).join('')}<p class="inventory-note">${t(g.note,g.noteEN)} <a href="${g.source}" target="_blank" rel="noopener">${t('Fonte','Source')}</a></p></article>`}).join('')}</div><details><summary>${t('Histórico de crescimento do catálogo local','Local catalogue growth log')}</summary>${d.history.map(x=>`<p>${x.date} · ${x.count} · ${esc(x.description)}</p>`).join('')}<p class="inventory-note">${t('Novas medições devem registrar data, fonte, unidade e estado de verificação; não somar inventários sobrepostos.','New measurements must record date, source, unit and verification status; do not sum overlapping inventories.')}</p></details></section>`}function dossierSection(p){if(typeof GHC_RESEARCH==='undefined')return '';const g=GHC_RESEARCH.groups.find(x=>x[0]===p);if(!g)return '';return `<section class="dossier-section"><details><summary>${t(g[1],g[2])} · ${t('Dossiê de investigação','Research dossier')}</summary><p class="inventory-note">${t('Levantamento preliminar de 27/11/2026; referências e lacunas a conferir nos originais.','Preliminary dossier, 27 Nov 2026; detailed notes in Portuguese, pending verification against originals.')}</p><ul>${g[3].map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><h3>${t('Fontes e instrumentos','Sources and finding aids')}</h3><ul>${g[4].map(i=>{const x=GHC_RESEARCH.sources[i];return '<li><a target="_blank" rel="noopener" href="'+x[1]+'">'+esc(x[0])+'</a></li>'}).join('')}</ul></details></section>`}
function archivalPage(){return title('Arquivo histórico e documental','Historical and documentary archive')+`<p>${t('Catálogo seletivo de fontes primárias e secundárias. Os identificadores de cartas seguem o índice da Gordon H. Clark Foundation.','Selective catalogue of primary and secondary sources. Letter IDs follow the Gordon H. Clark Foundation index.')}</p><article class="tile" id="correspondencias"><h2>${t('Correspondências e interlocuções','Correspondence and exchanges')}</h2><p>${t('Arquivo Clark–Van Til: 24 registros iniciais, cartas diretas e indiretas, documentos eclesiásticos, cotas e fontes institucionais.','Clark–Van Til archive: 24 initial records, direct and indirect letters, ecclesiastical documents, archival references and institutional sources.')}</p><a class="button" href="correspondencia-clark-vantil.html">${t('Consultar correspondências','Browse correspondence')}</a> · <a href="clark-vantil.csv">${t('Catálogo CSV','CSV catalogue')}</a></article><h2>${t('Catálogo geral do arquivo','General archive catalogue')}</h2><div class="filters"><input id="archiveq" value="${esc(archiveQuery)}" placeholder="${t('Nome, título ou data','Name, title or date')}" oninput="archiveQuery=this.value;archiveResults()"><select onchange="archiveKind=this.value;archiveResults()"><option value="">${t('Todos os tipos','All types')}</option>${[...new Map(archival.map(x=>[x[2],x[3]])).entries()].map(x=>`<option value="${x[0]}" ${archiveKind===x[0]?'selected':''}>${t(...x)}</option>`).join('')}</select></div><div id="archiveResults"></div><div id="archiveReader"></div><h2>${t('Acervos externos','External collections')}</h2><div class="grid">${docs.map((x,i)=>doc(i)).join('')}<article class="tile"><h3>${t('Fotografias e áudio','Photographs and audio')}</h3><p>${t('Consulte as coleções originais; imagens não reproduzidas sem verificação de direitos.','Consult original collections; images not reproduced without rights verification.')}</p><a href="https://gordonhclark.com/">Gordon H. Clark Foundation ↗</a><p><a href="https://www.douglasdouma.com/">Douglas Douma ↗</a></p></article></div><div id="reader"></div>`}
$('global').oninput=e=>{query=e.target.value.trim();render()};$('menu').onclick=()=>{$('nav').classList.toggle('open');$('menu').setAttribute('aria-expanded',$('nav').classList.contains('open'))};$('lang').onclick=()=>{lang=t('en','pt');localStorage.setItem('lang',lang);render()};$('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('dark',document.body.classList.contains('dark')?'1':'0')};if(localStorage.getItem('dark')==='1')document.body.classList.add('dark');let promptEvent;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e});$('install').onclick=async()=>{if(promptEvent){await promptEvent.prompt();promptEvent=null}else alert(t('Após publicar via HTTPS, abra o menu do Chrome e escolha Instalar aplicativo ou Adicionar à tela inicial.','After HTTPS deployment, use Chrome’s Install app or Add to Home screen option.'))};window.addEventListener('hashchange',()=>{let p=location.hash.slice(1);if(p==='letters')p='archive';if(sections.some(x=>x[0]===p)){page=p;query='';render()}});if(location.hash==='#letters')page='archive';else if(sections.some(x=>x[0]===location.hash.slice(1)))page=location.hash.slice(1);render();if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(console.warn);
</script></body></html>
